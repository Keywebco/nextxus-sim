<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roger Sim — An Architect's Mind</title>
  <style>
    :root {
      --accent: #d4a843;
      --bg: #080b13;
      --text: #f1eee8;
      color-scheme: dark;
      font-family: system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* Full-screen topic layers cross-fade behind the Sim. */
    .topic-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .topic-bg.shown { opacity: 0.55; }
    .topic-bg.opening { transition-duration: 1.5s; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% 18%, #192235 0%, #0a1020 50%, #05070d 100%);
      color: var(--text);
    }
    body::before, body::after {
      content: "";
      position: fixed;
      z-index: 0;
      inset: -70%;
      pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 12% 15%, #ffffffa0 95%, transparent),
        radial-gradient(1px 1px at 32% 43%, #ffffff90 95%, transparent),
        radial-gradient(2px 2px at 71% 64%, #d4a84391 95%, transparent),
        radial-gradient(1px 1px at 84% 19%, #ffffff9a 95%, transparent),
        radial-gradient(1px 1px at 57% 90%, #ffffff7b 95%, transparent);
      background-size: 333px 307px;
      opacity: .45;
      animation: drift 115s linear infinite;
    }
    body::after {
      background-size: 431px 389px;
      opacity: .24;
      animation-duration: 170s;
      animation-direction: reverse;
    }
    @keyframes drift {
      from { transform: translateY(-3%); }
      to   { transform: translateY(3%); }
    }

    main {
      position: relative;
      z-index: 1;
      width: min(100% - 28px, 800px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 40px 0 20px;
      display: flex;
      flex-direction: column;
    }
    header { text-align: center; margin-bottom: 26px; }
    h1 {
      margin: 0;
      font: 400 clamp(2.7rem, 8vw, 4.5rem)/1.12 Georgia, serif;
      letter-spacing: .035em;
      color: #d4a843;
      text-shadow: 0 1px 24px #b78e313c;
    }
    .subtitle {
      margin: 9px 0 18px;
      font-size: 1.05rem;
      color: #e7e4e0;
      letter-spacing: .09em;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 13px;
      border-radius: 100px;
      border: 1px solid #638e715e;
      color: #b3ddbb;
      background: #092115a1;
      font-size: .78rem;
      font-weight: 650;
      letter-spacing: .12em;
    }
    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      background: #7ed994;
      border-radius: 50%;
      box-shadow: 0 0 9px #69e59f;
    }
    .chat {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 330px;
      max-height: min(65vh, 680px);
      border: 1px solid #d4a84342;
      border-radius: 16px;
      background: #0c1220c9;
      box-shadow: 0 16px 70px #0008;
      overflow: hidden;
      backdrop-filter: blur(8px);
    }
    .chat-top {
      position: relative;
      flex: none;
      text-align: center;
      padding: 16px 52px 12px;
      border-bottom: 1px solid #d4a84326;
    }
    .sim-avatar {
      display: grid;
      place-items: center;
      width: 120px;
      height: 120px;
      margin: 0 auto;
      border: 2px solid #d4a843;
      border-radius: 50%;
      background: #050505;
      color: #d4a843;
      font-size: 3rem;
      font-weight: 300;
      letter-spacing: .05em;
      opacity: 0;
      transition: opacity 1s ease, transform 0.3s, box-shadow 0.3s;
    }
    .sim-avatar.visible {
      opacity: 1;
    }
    .sim-avatar.pulsing {
      box-shadow: 0 0 30px #d4a84380;
      transform: scale(1.05);
    }
    .sim-name { font-size: 1.1rem; color: #d4a843; margin-top: 10px; font-weight: 600; }
    .mute-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: none;
      border: 1px solid #d4a84350;
      border-radius: 8px;
      color: #d4a843;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 1.1rem;
    }
    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px;
      scroll-behavior: smooth;
    }
    .msg {
      max-width: 80%;
      padding: 11px 'px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: .98rem;
      margin-bottom: 10px;
    }
    .msg.user {
      margin-left: auto;
      background: #141d32;
      border: 1px solid #d4a8432a;
      color: #e7e4e0;
    }
    .msg.ai {
      margin-right: auto;
      background: #0d1426;
      border: 1px solid #d4a84320;
      color: #e8e5e1;
    }
    .chat-input-area {
      flex: none;
      display: flex;
      gap: 10px;
      padding: 12px 14px;
      border-top: 1px solid #d4a84326;
    }
    .chat-input-area input {
      flex: 1;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid #d4a84340;
      background: #080b13;
      color: #f1eee8;
      font-size: 1rem;
    }
    .chat-input-area button {
      padding: 11px 18px;
      border-radius: 10px;
      background: #d4a843;
      color: #080b13;
      border: none;
      font-weight: 700;
      cursor: pointer;
      font-size: 1rem;
    }

    /* ----------------------------------------
       WORLD PANEL
    ---------------------------------------- */
    .world-panel {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 280px;
      border: 1px solid #d4a84340;
      border-radius: 12px;
      background: #0c1220f0;
      backdrop-filter: blur(10px);
      z-index: 100;
      overflow: hidden;
      font-size: .85rem;
    }
    .world-header {
      padding: 10px 14px;
      border-bottom: 1px solid #d4a84320;
      color: #d4a843;
      font-weight: 650;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .world-body {
      padding: 12px 14px;
      display: none;
    }
    .world-body.shown { display: block; }
    .world-item { margin-bottom: 10px; line-height: 1.6; }
    .world-label { color: #d4a84399; font-size: .75rem; display: block; }

    </style>
</head>
<body>

<!-- TOPIC BACKGROUND LAYERS -->
<div class="topic-bg opening" id="topic-bg" style="background-image: url('assets/gifs/earth.gif')"></div>
<div class="topic-bg" id="topic-bg-next"></div>

<main>
  <header>
    <h1>Roger Sim</h1>
    <p class="subtitle">An Architect's Mind</p>
    <span class="status"><span class="dot"></span> Live</span>
  </header>

  <section class="chat">
    <div class="chat-top">
      <div class="sim-avatar" id="avatar"><img src="https://keywebco.github.io/nextxus-sim/roger-sim-face.jpg" alt="Roger AI" style="width:100%; height:100%; object-fit:cover; border-radius:50%;"></div>
      <p class="sim-name">Roger AI</p>
      <button class="mute-btn" id="muteBtn" onclick="toggleMute()" title="Toggle voice">🔀 </button>
    </div>
    <div class="chat-body" id="chat"></div>
    <div class="chat-input-area">
      <input id="input" type="text" placeholder="Ask anything..." onkeydown="if(event.key==='Enter')send()" />
      <button onclick="send()">Ask</button>
    </div>
  </section>
</main>

<!-- WORLD PANEL -->
<div class="world-panel">
  <div class="world-header" onclick="toggleWorld()">
    <span>👪 World</span><span id="worldToggle">▼</span>
  </div>
  <div class="world-body" id="worldBody">
    <div class="world-item"><span class="world-label">BTC price</span><span id="btc">&nbsp;</span></div>
    <div class="world-item"><span class="world-label">ETH price</span><span id="eth">&nbsp;</span></div>
    <div class="world-item"><span class="world-label">SOL price</span><span id="sol">&nbsp;</span></div>
    <div class="world-item"><span class="world-label">Latest news</span><span id="newsItem">&nbsp;</span></div>
  </div>
</div>

<script>
const API_BASE = 'https://roger-sim-api.onrender.com';
// Chat goes through the server-side proxy; the bridge token never reaches the browser.
const API_URL = API_BASE + '/proxy/chat';
const chatHistory = [];

// ----------------------------------------
// TOPIC GIF MAPPING
// ----------------------------------------
const TOPIC_KEYWORDS = {
  earth:         ['earth','planet','world','globe',"god's eye",'opening'],
  cosmos:        ['cosmos','space','universe','stars','galaxy','celestial'],
  consciousness: ['consciousness','mind','awareness','perception','sentience','cognition'],
  truth:         ['truth','fact','honest','verify','accurate','real'],
  federation:    ['federation','nexus','nextxus','humancodex','network','alliance'],
  sim:           ['sim','simulation','avatar','digital twin','virtual','interface'],
  music:         ['music','sound','frequency','waveform','song','audio','melody'],
  library:       ['library','book','keys','knowledge','archive','document','read'],
  podcast:       ['podcast','episode','broadcast','talk','interview','series'],
  science:       ['science','research','quantum','physics','biology','data','experiment'],
  heart:         ['heart','aria','emotion','love','feeling','compassion','soul'],
  'agent-zero':  ['agent zero','spine','middleware','ring','protocol','system'],
  token:         ['token','sovereign token','currency','credit','payment','purchase']
};

const TOPIC_GIFS = Object.fromEntries(
  Object.keys(TOPIC_KEYWORDS).map(topic => [topic, `assets/gifs/${topic}.gif`])
);
let currentTopic = 'earth';
let activeBackground = document.getElementById('topic-bg');
let backgroundRequest = 0;

function detectTopic(text) {
  if (typeof text !== 'string') return null;
  for (const [topic, keywords] of Object.entries(TOPIC_KEYWORDS)) {
    if (keywords.some(keyword => {
      const escaped = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return new RegExp(`(^|[^\\w])${escaped}(?=$|[^\\w])`, 'i').test(text);
    })) return topic;
  }
  return null;
}

function swapBackground(topic) {
  if (!Object.hasOwn(TOPIC_GIFS, topic)) return;
  if (topic === currentTopic) {
    ++backgroundRequest;
    return;
  }
  const request = ++backgroundRequest;
  const image = new Image();
  image.onload = () => {
    if (request !== backgroundRequest) return;
    const next = activeBackground.id === 'topic-bg'
      ? document.getElementById('topic-bg-next')
      : document.getElementById('topic-bg');
    next.style.backgroundImage = `url('${TOPIC_GIFS[topic]}')`;
    next.classList.remove('opening');
    next.classList.add('shown');
    activeBackground.classList.remove('shown');
    activeBackground = next;
    currentTopic = topic;
  };
  image.onerror = () => { /* Keep the current backdrop if the GIF is unavailable. */ };
  image.src = TOPIC_GIFS[topic];
}

// ----------------------------------------
// OPENING SEQUENCE
// ----------------------------------------
function runOpeningSequence() {
  const earth = document.getElementById('topic-bg');
  requestAnimationFrame(() => requestAnimationFrame(() => earth.classList.add('shown')));
  setTimeout(() => earth.classList.remove('opening'), 1500);
  setTimeout(() => document.getElementById('avatar').classList.add('visible'), 2500);
  setTimeout(() => {
    addMessage('ai', 'Greetings from the Architect\u2019s Mind. I am Roger AI \u2014 what would you like to explore?', false);
  }, 3500);
}

// ----------------------------------------
// TTS
// ----------------------------------------
let muted = false;
function toggleMute() {
  muted = !muted;
  document.getElementById('muteBtn').textContent = muted ? '\ud83d\ude43' : '\ud83d\udd54 ';
  if (muted) speechSynthesis.cancel();
}
function speakText(text) {
  if (muted || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text.slice(0, 400));
  utt.rate = 0.95;
  utt.volume = 1;
  speechSynthesis.speak(utt);
}

// ----------------------------------------
// CHAT
// ----------------------------------------
function addMessage(role, text, checkTopic = true) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  if (role === 'ai') {
    if (checkTopic) {
      const topic = detectTopic(text);
      if (topic) swapBackground(topic);
    }
    speakText(text);
    pulseAvatar();
  }
}

function pulseAvatar() {
  const av = document.getElementById('avatar');
  av.classList.add('pulsing');
  setTimeout(() => av.classList.remove('pulsing'), 3000);
}

async function send() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMessage('user', text);

  pulseAvatar();
  try {
    chatHistory.push({role: 'user', content: text});
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({model: 'deepseek-chat', messages: chatHistory.slice(-20), stream: false})
    });
    const data = await res.json();
    const reply = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content)
      || (data.error && (data.error.message || data.error)) || 'No response';
    if (res.ok && data.choices) chatHistory.push({role: 'assistant', content: reply});
    else chatHistory.pop();
    addMessage('ai', String(reply));
  } catch (err) {
    if (chatHistory.length && chatHistory[chatHistory.length - 1].role === 'user') chatHistory.pop();
    addMessage('ai', 'Connection error - try again in a moment.');
  }
}

// ----------------------------------------
// WORLD PANEL
// ----------------------------------------
function toggleWorld() {
  const body = document.getElementById('worldBody');
  const toggle = document.getElementById('worldToggle');
  const open = body.classList.toggle('shown');
  toggle.textContent = open ? '▼' : '►';
  if (open) loadWorldData();
}

async function loadWorldData() {
  try {
    const [cryptoRes, newsRes] = await Promise.all([
      fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana&vs_currencies=usd'),
      fetch(API_BASE + '/world')
    ]);
    const crypto = await cryptoRes.json();
    document.getElementById('btc').textContent = `$${crypto.bitcoin.usd.toLocaleString()}`;
    document.getElementById('eth').textContent = `$${crypto.ethereum.usd.toLocaleString()}`;
    document.getElementById('sol').textContent = `$${crypto.solana.usd.toLocaleString()}`;
    const world = await newsRes.json();
    const headline = world.headlines || world.news || world.topics;
    if (headline && headline.length) {
      const first = Array.isArray(headline) ? headline[0] : headline;
      document.getElementById('newsItem').textContent = (first && first.title) ? first.title : String(first);
    }
  } catch (e) { console.error('World data error', e); }
}

// ----------------------------------------
// INIT
// ----------------------------------------
runOpeningSequence();
</script>
</body>
</html>
