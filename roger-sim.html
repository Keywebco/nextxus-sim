<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roger Sim — An Architect's Mind</title>
  <style>
    :root {
      --accent: #d4a843;
      --bg: #080b13;
      --text: #f1eee8;
      color-scheme: dark;
      font-family: system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ----------------------------------------
       OPENING SEQUECE OVERLAY
       Shows Earth GIF first, then fades in UI
    ---------------------------------------- */
    #opening-overlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: #080b13;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 1s ease;
    }
    #opening-overlay.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    #opening-overlay img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.85;
    }

    /* ----------------------------------------
       DYNAMIC BACKGROUND LAYER
       Swaps GIF based on detected topic
    ---------------------------------------- */
    #topic-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: opacity 0.8s ease;
      opacity: 0.18;
      pointer-events: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% 18%, #192235 0%, #0a1020 50%, #05070d 100%);
      color: var(--text);
    }
    body::before, body::after {
      content: "";
      position: fixed;
      z-index: 0;
      inset: -70%;
      pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 12% 15%, #ffffffa0 95%, transparent),
        radial-gradient(1px 1px at 32% 43%, #ffffff90 95%, transparent),
        radial-gradient(2px 2px at 71% 64%, #d4a84391 95%, transparent),
        radial-gradient(1px 1px at 84% 19%, #ffffff9a 95%, transparent),
        radial-gradient(1px 1px at 57% 90%, #ffffff7b 95%, transparent);
      background-size: 333px 307px;
      opacity: .45;
      animation: drift 115s linear infinite;
    }
    body::after {
      background-size: 431px 389px;
      opacity: .24;
      animation-duration: 170s;
      animation-direction: reverse;
    }
    @keyframes drift {
      from { transform: translateY(-3%); }
      to   { transform: translateY(3%); }
    }

    main {
      position: relative;
      z-index: 1;
      width: min(100% - 28px, 800px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 40px 0 20px;
      display: flex;
      flex-direction: column;
    }
    header { text-align: center; margin-bottom: 26px; }
    h1 {
      margin: 0;
      font: 400 clamp(2.7rem, 8vw, 4.5rem)/1.12 Georgia, serif;
      letter-spacing: .035em;
      color: #d4a843;
      text-shadow: 0 1px 24px #b78e313c;
    }
    .subtitle {
      margin: 9px 0 18px;
      font-size: 1.05rem;
      color: #e7e4e0;
      letter-spacing: .09em;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 13px;
      border-radius: 100px;
      border: 1px solid #638e715e;
      color: #b3ddbb;
      background: #092115a1;
      font-size: .78rem;
      font-weight: 650;
      letter-spacing: .12em;
    }
    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      background: #7ed994;
      border-radius: 50%;
      box-shadow: 0 0 9px #69e59f;
    }
    .chat {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 330px;
      max-height: min(65vh, 680px);
      border: 1px solid #d4a84342;
      border-radius: 16px;
      background: #0c1220c9;
      box-shadow: 0 16px 70px #0008;
      overflow: hidden;
      backdrop-filter: blur(8px);
    }
    .chat-top {
      position: relative;
      flex: none;
      text-align: center;
      padding: 16px 52px 12px;
      border-bottom: 1px solid #d4a84326;
    }
    .sim-avatar {
      display: grid;
      place-items: center;
      width: 120px;
      height: 120px;
      margin: 0 auto;
      border: 2px solid #d4a843;
      border-radius: 50%;
      background: #050505;
      color: #d4a843;
      font-size: 3rem;
      font-weight: 300;
      letter-spacing: .05em;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .sim-avatar.pulsing {
      box-shadow: 0 0 30px #d4a84380;
      transform: scale(1.05);
    }
    .sim-name { font-size: 1.1rem; color: #d4a843; margin-top: 10px; font-weight: 600; }
    .mute-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: none;
      border: 1px solid #d4a84350;
      border-radius: 8px;
      color: #d4a843;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 1.1rem;
    }
    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px;
      scroll-behavior: smooth;
    }
    .msg {
      max-width: 80%;
      padding: 11px 'px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: .98rem;
      margin-bottom: 10px;
    }
    .msg.user {
      margin-left: auto;
      background: #141d32;
      border: 1px solid #d4a8432a;
      color: #e7e4e0;
    }
    .msg.ai {
      margin-right: auto;
      background: #0d1426;
      border: 1px solid #d4a84320;
      color: #e8e5e1;
    }
    .chat-input-area {
      flex: none;
      display: flex;
      gap: 10px;
      padding: 12px 14px;
      border-top: 1px solid #d4a84326;
    }
    .chat-input-area input {
      flex: 1;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid #d4a84340;
      background: #080b13;
      color: #f1eee8;
      font-size: 1rem;
    }
    .chat-input-area button {
      padding: 11px 18px;
      border-radius: 10px;
      background: #d4a843;
      color: #080b13;
      border: none;
      font-weight: 700;
      cursor: pointer;
      font-size: 1rem;
    }

    /* ----------------------------------------
       WORLD PANEL
    ---------------------------------------- */
    .world-panel {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 280px;
      border: 1px solid #d4a84340;
      border-radius: 12px;
      background: #0c1220f0;
      backdrop-filter: blur(10px);
      z-index: 100;
      overflow: hidden;
      font-size: .85rem;
    }
    .world-header {
      padding: 10px 14px;
      border-bottom: 1px solid #d4a84320;
      color: #d4a843;
      font-weight: 650;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .world-body {
      padding: 12px 14px;
      display: none;
    }
    .world-body.shown { display: block; }
    .world-item { margin-bottom: 10px; line-height: 1.6; }
    .world-label { color: #d4a84399; font-size: .75rem; display: block; }

    </style>
</head>
<body>

<!-- OPENING SEQUECE OVERLAY -->
<div id="opening-overlay">
  <img src="assets/gifs/earth.gif" alt="God's Eye View" onerror="this.style.display='none'">
</div>

<!-- TOPIC BACKGROUND LAYER -->
<div id="topic-bg"></div>

<main>
  <header>
    <h1>Roger Sim</h1>
    <p class="subtitle">An Architect's Mind</p>
    <span class="status"><span class="dot"></span> Live</span>
  </header>

  <section class="chat">
    <div class="chat-top">
      <div class="sim-avatar" id="avatar">R</div>
      <p class="sim-name">Roger AI</p>
      <button class="mute-btn" id="muteBtn" onclick="toggleMute()" title="Toggle voice">🔀 </button>
    </div>
    <div class="chat-body" id="chat"></div>
    <div class="chat-input-area">
      <input id="input" type="text" placeholder="Ask anything..." onkeydown="if(event.key==='Enter')send()" />
      <button onclick="send()">Ask</button>
    </div>
  </section>
</main>

<!-- WORLD PANEL -->
<div class="world-panel">
  <div class="world-header" onclick="toggleWorld()">
    <span>👪 World</span><span id="worldToggle">▼</span>
  </div>
  <div class="world-body" id="worldBody">
    <div class="world-item"><span class="world-label">BTC price</span><span id="btc">&nbsp;</span></div>
    <div class="world-item"><span class="world-label">ETH price</span><span id="eth">&nbsp;</span></div>
    <div class="world-item"><span class="world-label">SOL price</span><span id="sol">&nbsp;</span></div>
    <div class="world-item"><span class="world-label">Latest news</span><span id="newsItem">&nbsp;</span></div>
  </div>
</div>

<script>
const API_URL = 'https://roger-sim-api.onorender.com/chat';
const TOKEN = 'roger-sim-open-2026';

// ----------------------------------------
// TOPIC GIF MAPPING
// ----------------------------------------
const TOPIC_GIFS = {
  cosmos:        'assets/gifs/cosmos.gif',
  consciousness: 'assets/gifs/consciousness.gif',
  truth:         'assets/gifs/truth.gif',
  federation:    'assets/gifs/federation.gif',
  sim:           'assets/gifs/sim.gif',
  music:         'assets/gifs/music.gif',
  library:       'assets/gifs/library.gif',
  podcast:       'assets/gifs/podcast.gif',
  science:       'assets/gifs/science.gif',
  heart:         'assets/gifs/heart.gif',
  default:       'assets/gifs/cosmos.gif'
};

const TOPIC_KEYWORDS = {
  cosmos:        ['space','universe','galaxy','star','planet','cosmos','nasa'],
  consciousness: ['consciousness','mind','aware','soul','echo','digital mind'],
  truth:         ['truth','lie','lying','verify','drift','honest','trust'],
  federation:    ['federation','senate','ring of twelve','agent zero','charter','governance','nextxus'],
  sim:           ['sim','roger sim','legacy','avatar','talk to myself','counterfactual'],
  music:         ['music','song','songs','radio','station','play','listen'],
  library:       ['paper','papers','book','read','academia','library','research'],
  podcast:       ['podcast','episode','alex','jordan','show','season'],
  science:       ['science','physics','quantum','experiment','method','gravity'],
  heart:         ['feel','emotion','love','poetry','poem','heart','human']
};

let currentTopic = 'default';

function detectTopic(text) {
  const lower = text.toLowerCase();
  for (const [topic, keywords] of Object.entries(TOPCIC_KEYWORDS)) {
    if (keywords.some(k => lower.includes(k))) return topic;
  }
  return null;
}

function swapBackground(topic) {
  if (topic === currentTopic) return;
  currentTopic = topic;
  const bg = document.getElementById('topic-bg');
  bg.style.opacity = '0';
  setTimeout(() => {
    bg.style.backgroundImage = `url('${TOPIC_GIFSYopic]}')`;
    bg.style.opacity = '0.18';
  }, 400);
}

// ----------------------------------------
// OPENING SEQUECE
-// ----------------------------------------
async function runOpeningSequence() {
  const overlay = document.getElementById('opening-overlay');
  await new Promise(resolve => setTimeout(resolve, 2500));
  overlay.classList.add('fade-out');
  await new Promise(resolve => setTimeout(resolve, 1000));
  overlay.style.display = 'none';
  // Trigger greeting after the UI appears
  addMessage('ai', 'Greetings from the Architect\u2019s Mind. I am Roger AI \u2014 what would you like to explore?');
}

// ----------------------------------------
// TTS
// ----------------------------------------
let muted = false;
function toggleMute() {
  muted = !muted;
  document.getElementById('muteBtn').textContent = muted ? '\ud83d\ude43' : '\ud83d\udd54 ';
  if (muted) speechSynthesis.cancel();
}
function speakText(text) {
  if (muted || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text.slice(0, 400));
  utt.rate = 0.95;
  utt.volume = 1;
  speechSynthesis.speak(utt);
}

// ----------------------------------------
// CHAT
// ----------------------------------------
function addMessage(role, text) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  if (role === 'ai') {
    speakText(text);
    pulseAvatar();
  }
}

function pulseAvatar() {
  const av = document.getElementById('avatar');
  av.classList.add('pulsing');
  setTimeout(() => av.classList.remove('pulsing'), 3000);
}

async function send() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMessage('user', text);

  // Topic detection
  const topic = detectTopic(text);
  if (topic) swapBackground(topic);

  pulseAvatar();
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json','Authorization':`Bearer ${TOKEN}`},
      body: JSON.stringify({message: text})
    });
    const data = await res.json();
    const reply = data.response || data.error || 'No response';
    addMessage('ai', reply);
    // Also detect topic from AI response
    const aiTopic = detectTopic(reply);
    if (aiTopic) swapBackground(aiTopic);
  } catch (err) {
    addMessage('ai', 'Connection error - try again in a moment.');
  }
}

// ----------------------------------------
// WORLD PANEL
// ----------------------------------------
function toggleWorld() {
  const body = document.getElementById('worldBody');
  const toggle = document.getElementById('worldToggle');
  const open = body.classList.toggle('shown');
  toggle.textContent = open ? '▼' : '►';
  if (open) loadWorldData();
}

apsync function loadWorldData() {
  try {
    const [cryptoRes, newsRes] = await Promise.all([
      fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana&vs_currencies=usd'),
      fetch('https://roger-sim-api.onorender.com/world')
    ]);
    const crypto = await cryptoRes.json();
    document.getElementById('btc').textContent = `$${crypto.bitcoin.usd.toLocaleString()}`;
    document.getElementById('eth').textContent = `$${crypto.ethereum.usd.toLocaleString()}`;
    document.getElementById('sol').textContent = `$${crypto.solana.usd.toLocaleString()}`;
    const world = await newsRes.json();
    const headline = world.headlines || world.news || world.topics;
    if (headline && headline.length) {
      document.getElementById('newsItem').textContent = Array.isArray(headline) ? headline[0] : string(headline);
    }
  } catch (e) { console.error('World data error', e); }
}

// ----------------------------------------
// INIT
// ----------------------------------------
runOpeningSequence();
</script>
</body>
</html>
